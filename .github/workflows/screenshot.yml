name: Capture sources and render current-affairs video

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      url:
        description: Website URL to capture
        required: true
        default: https://example.com
      full_page:
        description: Capture the full page
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  screenshot-and-render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright and rendering dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright pillow numpy
          python -m playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Capture source pages
        env:
          TARGET_URL: ${{ inputs.url || 'https://example.com' }}
          FULL_PAGE: ${{ inputs.full_page || 'false' }}
        run: python screenshot.py

      - name: Render documentary
        run: python render_video.py

      - name: Upload finished video and project assets
        uses: actions/upload-artifact@v4
        with:
          name: hackwithmorty-ai-cyber-campaign
          path: |
            output/
            screenshots/
          if-no-files-found: error
          retention-days: 14
